<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integration Status</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8f9f7;
        --card: #ffffff;
        --text: #2d3a2f;
        --muted: #647067;
        --success: #5f8f6f;
        --error: #c45c5c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: radial-gradient(circle at top, #eef3ee, var(--bg));
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
      }

      .card {
        width: min(520px, 100%);
        background: var(--card);
        border-radius: 24px;
        padding: 28px 24px;
        box-shadow: 0 14px 40px rgba(20, 28, 24, 0.12);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 999px;
        font-size: 30px;
        font-weight: 600;
        margin-bottom: 16px;
      }

      .badge.success {
        background: #e6f2ea;
        color: var(--success);
      }

      .badge.error {
        background: #fae9e9;
        color: var(--error);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .details {
        margin-top: 16px;
        padding: 12px;
        border-radius: 12px;
        background: #f5f7f5;
        font-size: 14px;
      }

      .countdown {
        margin-top: 18px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div id="badge" class="badge">...</div>
      <h1 id="title">Finishing connection...</h1>
      <p id="message">Please wait while we finalize your integration setup.</p>
      <p id="details" class="details" hidden></p>
      <p id="countdown" class="countdown"></p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const provider = (params.get("provider") || "integration").toLowerCase();
      const success = params.get("success") === "true";
      const error = params.get("error");
      const githubUsername = params.get("github_username");

      const providerLabel =
        provider === "github" ? "GitHub" : provider === "slack" ? "Slack" : "Integration";

      const badgeEl = document.getElementById("badge");
      const titleEl = document.getElementById("title");
      const messageEl = document.getElementById("message");
      const detailsEl = document.getElementById("details");
      const countdownEl = document.getElementById("countdown");

      if (success) {
        badgeEl.textContent = "✓";
        badgeEl.classList.add("success");
        titleEl.textContent = `${providerLabel} connected`;
        messageEl.textContent = `${providerLabel} is now connected. You can continue in the main app window.`;
        if (githubUsername) {
          detailsEl.hidden = false;
          detailsEl.textContent = `Connected account: ${githubUsername}`;
        }
      } else {
        badgeEl.textContent = "!";
        badgeEl.classList.add("error");
        titleEl.textContent = `Could not connect ${providerLabel}`;
        messageEl.textContent =
          "Something went wrong during authorization. Please close this window and try again.";
        if (error) {
          detailsEl.hidden = false;
          detailsEl.textContent = `Error: ${error}`;
        }
      }

      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage(
            {
              type: "oauth-complete",
              provider,
              success,
              error: error || null,
            },
            window.location.origin,
          );
        } catch {
          // Ignore cross-window messaging failures.
        }
      }

      const hasOpener = !!(window.opener && !window.opener.closed);
      let secondsLeft = success ? 4 : 7;
      countdownEl.textContent = hasOpener
        ? `This window will close in ${secondsLeft}s.`
        : `Returning to the app in ${secondsLeft}s.`;
      const timer = window.setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          window.clearInterval(timer);
          if (hasOpener) {
            window.close();
          } else {
            window.location.assign(`${window.location.origin}/`);
          }
          return;
        }
        countdownEl.textContent = hasOpener
          ? `This window will close in ${secondsLeft}s.`
          : `Returning to the app in ${secondsLeft}s.`;
      }, 1000);
    </script>
  </body>
</html>
